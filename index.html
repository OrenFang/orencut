<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OrenCut 动效组件库</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #242129;
      background: #f5f4f0;
      --paper: #fff;
      --ink: #242129;
      --muted: #65616e;
      --line: #dedae1;
      --accent: #6038bf;
      --soft-accent: #eee8fb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, video:focus-visible {
      outline: 3px solid #8a62e7;
      outline-offset: 3px;
    }
    button:disabled { cursor: default; }
    .page { width: min(1340px, calc(100% - 88px)); margin: auto; padding: 59px 0 70px; }
    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 31px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(32px, 4.2vw, 59px);
      letter-spacing: -.059em;
      line-height: 1.08;
    }
    .intro p { margin: 15px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .search { position: relative; width: min(100%, 312px); flex: 0 0 auto; }
    .search input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
    }
    .search input::placeholder { color: #75717c; }
    .search::before {
      content: "";
      position: absolute;
      z-index: 1;
      left: 17px;
      top: 14px;
      width: 13px;
      height: 13px;
      border: 1.5px solid #75717c;
      border-radius: 50%;
      pointer-events: none;
    }
    .search::after {
      content: "";
      position: absolute;
      z-index: 1;
      left: 27px;
      top: 26px;
      width: 7px;
      height: 1.5px;
      border-radius: 1px;
      background: #75717c;
      transform: rotate(47deg);
      pointer-events: none;
    }
    .toolbar { display: flex; align-items: center; gap: 15px; padding: 19px 0 22px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter {
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #56515f;
      font-size: 13px;
      white-space: nowrap;
    }
    .filter:hover { background: #eae7e9; color: var(--ink); }
    .filter[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 650; }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 21px; }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100%;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
      overflow: hidden;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible {
      border-color: #a789de;
      box-shadow: 0 12px 30px #34224c14;
      transform: translateY(-3px);
    }
    .preview {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #29262d;
      isolation: isolate;
    }
    .preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .preview.portrait img { object-fit: contain; background: #15141a; }
    .preview::after {
      content: "";
      position: absolute;
      inset: 43% 0 0;
      background: linear-gradient(transparent, #14121b65);
      pointer-events: none;
    }
    .play {
      display: grid;
      place-items: center;
      position: absolute;
      inset: 50% auto auto 50%;
      width: 52px;
      height: 52px;
      z-index: 1;
      border: 1px solid #ffffff65;
      border-radius: 50%;
      background: #1a1628bd;
      box-shadow: 0 5px 22px #100b2549;
      transform: translate(-50%, -50%);
      transition: background .18s ease, scale .18s ease;
    }
    .play::after {
      content: "";
      margin-left: 3px;
      border: 8px solid transparent;
      border-right: 0;
      border-left: 13px solid #fff;
    }
    .card:hover .play, .card:focus-visible .play { background: var(--accent); scale: 1.1; }
    .preview-duration {
      z-index: 1;
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #17141eda;
      color: #fff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .card-copy { display: grid; gap: 8px; padding: 15px 16px 16px; }
    .card-title { font-size: clamp(15px, 1.43vw, 19px); line-height: 1.35; font-weight: 760; }
    .card-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .empty { padding: 60px 18px; text-align: center; color: var(--muted); }
    .empty[hidden], [hidden] { display: none; }
    dialog {
      width: min(1190px, calc(100% - 48px));
      max-height: calc(100% - 44px);
      padding: 0;
      border: 1px solid #e1dce6;
      border-radius: 18px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 26px 80px #15101a55;
    }
    dialog::backdrop { background: #211a2ed1; backdrop-filter: blur(5px); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 14px;
      padding: 21px 23px 17px;
      border-bottom: 1px solid #eeebf0;
    }
    .modal-group { color: var(--accent); font-size: 12px; font-weight: 680; margin: 0 0 7px; }
    .modal-head h2 { margin: 0; font-size: clamp(21px, 3vw, 31px); line-height: 1.19; letter-spacing: -.035em; }
    .modal-actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .icon-btn {
      width: 37px;
      height: 37px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
    }
    .icon-btn:hover:not(:disabled) { background: var(--soft-accent); border-color: #b69deb; }
    .icon-btn:disabled { opacity: .3; }
    .modal-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(205px, 265px); gap: 22px; padding: 22px 23px 24px; }
    .modal-media { position: relative; min-width: 0; }
    .modal-media video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      background: #17151b;
      border-radius: 10px;
    }
    .media-error { margin: 9px 0 0; color: #9c2839; font-size: 13px; }
    .modal-detail { min-width: 0; }
    .timing { margin: 0 0 8px; font-size: 15px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .note { margin: 13px 0 18px; color: #504b58; font-size: 13px; line-height: 1.68; overflow-wrap: anywhere; }
    .source-title { margin: 20px 0 8px; font-size: 13px; font-weight: 760; }
    .detail-links { display: flex; gap: 4px 12px; flex-wrap: wrap; }
    .sources { list-style: none; display: grid; gap: 8px; margin: 0; padding: 0; }
    .source-name, .plain-link {
      color: var(--accent);
      font-size: 13px;
      line-height: 1.5;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }
    span.source-name { text-decoration: none; }
    .line { color: var(--muted); font-size: 12px; margin-left: 5px; }
    .source-copy {
      margin: 5px 0 0;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--paper);
      color: #55416f;
      font-size: 11px;
    }
    .source-copy:hover { background: var(--soft-accent); }
    .source-path {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
      user-select: all;
    }
    .source-path[hidden] { display: none; }
    @media (max-width: 980px) {
      .page { width: calc(100% - 54px); padding-top: 41px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      dialog { width: calc(100% - 28px); max-height: calc(100% - 25px); }
      .modal-body { grid-template-columns: 1fr; gap: 16px; padding: 15px 17px 22px; }
      .modal-head { padding: 16px 17px 13px; }
    }
    @media (max-width: 570px) {
      .page { width: calc(100% - 32px); padding: 28px 0 45px; }
      .intro { align-items: stretch; flex-direction: column; gap: 16px; padding-bottom: 18px; }
      .intro p { margin-top: 10px; font-size: 14px; }
      .search { width: 100%; }
      .toolbar { align-items: start; padding: 15px 0 16px; flex-direction: column; gap: 7px; }
      .result-count { margin-left: 2px; }
      .filters { gap: 2px; }
      .filter { padding: 7px 9px; }
      .gallery { grid-template-columns: minmax(0, 1fr); gap: 15px; }
      .card-copy { padding: 12px 13px; }
      .card-title { font-size: 17px; }
      .icon-btn { width: 31px; height: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <div>
        <h1>OrenCut 动效组件库</h1>
        <p>点击画面，播放静音动效并查看可编辑源码。</p>
      </div>
      <div class="search">
        <input id="search" type="search" aria-label="搜索动效" placeholder="搜索动效、期数或源码" autocomplete="off">
      </div>
    </header>
    <div class="toolbar">
      <div id="filters" class="filters" role="group" aria-label="按动效类别筛选"></div>
      <span id="result-count" class="result-count" role="status"></span>
    </div>
    <section id="gallery" class="gallery" aria-label="动效片段"></section>
    <p id="empty" class="empty" hidden>没有找到匹配的动效。</p>
  </main>
  <dialog id="player" aria-labelledby="player-title">
    <div class="modal-head">
      <div>
        <p id="player-group" class="modal-group"></p>
        <h2 id="player-title"></h2>
      </div>
      <div class="modal-actions">
        <button id="previous" class="icon-btn" type="button" aria-label="上一个片段" title="上一个片段">‹</button>
        <button id="next" class="icon-btn" type="button" aria-label="下一个片段" title="下一个片段">›</button>
        <button id="dismiss" class="icon-btn" type="button" aria-label="关闭播放窗口" title="关闭播放窗口">×</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-media">
        <video id="video" controls muted playsinline preload="metadata" aria-label="动效片段"></video>
        <p id="media-error" class="media-error" hidden>浏览器无法播放这个片段。 <a id="fallback" class="plain-link" target="_blank" rel="noopener">打开 MP4 文件</a></p>
      </div>
      <aside class="modal-detail" aria-label="片段详情">
        <p id="timing" class="timing"></p>
        <p id="note" class="note"></p>
        <div id="source-block">
          <h3 class="source-title">对应源码</h3>
          <ul id="sources" class="sources"></ul>
        </div>
      </aside>
    </div>
  </dialog>

":"previews/21.jpg","video":"previews/21.mp4","sources":[{"label":"引文板","file":"src/middle.tsx","symbol":"Quote","line":8,"url":"source/08/src/middle.tsx.html#L8"},{"label":"全局叠层","file":"src/visual.tsx","symbol":"VisualScene","line":20,"url":"source/08/src/visual.tsx.html#L20"}],"note":"Remotion Studio 合成 Motion21 · 30 fps","version":"静音版"},{"id":"22","slot":"10","group":"列表、引文与投票逐项揭示","title":"十张投票卡交错滑入两列五行","start":"3:20.567","end":"3:23.067","seconds":2.5,"portrait":true,"poster":"previews/22.jpg","video":"previews/22.mp4","sources":[{"label":"Poll","file":"src/ranking.tsx","symbol":"Poll","line":159,"url":"source/10/src/ranking.tsx.html#L159"}],"note":"Remotion Studio 合成 Motion22 · 30 fps","version":"静音版"},{"id":"28","slot":"06","group":"列表、引文与投票逐项揭示","title":"竖屏双数字滚动，六格角色卡依次亮起","start":"0:39.800","end":"0:43.100","seconds":3.3,"portrait":true,"poster":"previews/28.jpg","video":"previews/28.mp4","sources":[{"label":"角色列表","file":"src/early.tsx","symbol":"GameRoles","line":53,"url":"source/06/src/early.tsx.html#L53"}],"note":"Remotion Studio 合成 Motion28 · 30 fps","version":"静音版"},{"id":"29","slot":"06","group":"列表、引文与投票逐项揭示","title":"竖屏流程卡依次打勾，红章落下","start":"3:42.467","end":"3:45.367","seconds":2.9,"portrait":true,"poster":"previews/29.jpg","video":"previews/29.mp4","sources":[{"label":"流程与盖章","file":"src/bookends.tsx","symbol":"Credits","line":128,"url":"source/06/src/bookends.tsx.html#L128"}],"note":"Remotion Studio 合成 Motion29 · 30 fps","version":"静音版"}]</script>
  <script>
    (() => {
      "use strict";
      const byId = id => document.getElementById(id);
      const data = JSON.parse(byId("catalog-data").textContent);
      const gallery = byId("gallery");
      const filters = byId("filters");
      const search = byId("search");
      const dialog = byId("player");
      const video = byId("video");
      const previous = byId("previous");
      const next = byId("next");
      const dismiss = byId("dismiss");
      let selectedGroup = "";
      let visible = [];
      let active = -1;
      let activationTarget;

      function make(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text != null) element.textContent = text;
        return element;
      }

      function episodeLabel(slot) {
        return /^\d+$/.test(String(slot)) ? `第 ${slot} 期` : String(slot);
      }

      function timeLabel(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) return String(value ?? "");
        const minutes = Math.floor(value / 60);
        const rest = (value % 60).toFixed(2).padStart(5, "0");
        return `${String(minutes).padStart(2, "0")}:${rest.replace(/\.?0+$/, "")}`;
      }

      function durationLabel(value) {
        if (value == null || value === "") return "";
        if (typeof value === "number" && Number.isFinite(value)) return `${Number(value.toFixed(1))} 秒`;
        return /[秒s]$/i.test(String(value)) ? String(value) : `${value} 秒`;
      }

      for (const group of ["", ...new Set(data.map(item => item.group))]) {
        const button = make("button", "filter", group || "全部");
        button.type = "button";
        button.dataset.group = group;
        button.addEventListener("click", () => {
          selectedGroup = group;
          render();
        });
        filters.append(button);
      }

      function makeCard(item, index) {
        const card = make("button", "card");
        card.type = "button";
        card.dataset.id = item.id;
        card.setAttribute("aria-label", `播放 ${item.title}`);
        const preview = make("span", item.portrait ? "preview portrait" : "preview");
        const image = make("img");
        image.src = item.poster;
        image.alt = "";
        image.loading = index < 6 ? "eager" : "lazy";
        image.decoding = "async";
        const play = make("span", "play");
        play.setAttribute("aria-hidden", "true");
        preview.append(image, play);
        const length = durationLabel(item.seconds);
        if (length) preview.append(make("span", "preview-duration", length));
        const copy = make("span", "card-copy");
        copy.append(
          make("span", "card-title", item.title),
          make("span", "card-meta", [item.group, episodeLabel(item.slot), item.version].filter(Boolean).join(" · "))
        );
        card.append(preview, copy);
        card.addEventListener("click", () => open(index, card));
        return card;
      }

      function render() {
        const terms = search.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
        visible = data.filter(item => {
          const searchable = [item.title, item.group, episodeLabel(item.slot), item.version, item.note,
            ...(item.sources || []).flatMap(source => [source.label, source.symbol, source.file])].join(" ").toLocaleLowerCase();
          return (!selectedGroup || item.group === selectedGroup) && terms.every(term => searchable.includes(term));
        });
        for (const button of filters.children) {
          button.setAttribute("aria-pressed", String(button.dataset.group === selectedGroup));
        }
        gallery.replaceChildren(...visible.map(makeCard));
        byId("result-count").textContent = `${visible.length} 个组件`;
        byId("empty").hidden = visible.length > 0;
      }

      function sourceLink(source) {
        const item = make("li");
        const link = make("a", "source-name", source.label);
        link.title = [source.file, source.symbol].filter(Boolean).join(" · ");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener";
        item.append(link);
        if (source.line) item.append(make("span", "line", `第 ${source.line} 行`));
        return item;
      }

      function open(index, target) {
        const item = visible[index];
        if (!item) return;
        active = index;
        if (target) activationTarget = target;
        byId("player-title").textContent = item.title;
        byId("player-group").textContent = [item.group, item.version].filter(Boolean).join(" · ");
        const range = [timeLabel(item.start), timeLabel(item.end)].filter(Boolean).join(" – ");
        byId("timing").textContent = [episodeLabel(item.slot), range].filter(Boolean).join(" · ");
        const note = byId("note");
        note.textContent = item.note || "";
        note.hidden = !item.note;
        const sourceItems = (item.sources || []).map(sourceLink);
        byId("sources").replaceChildren(...sourceItems);
        byId("source-block").hidden = sourceItems.length === 0;
        previous.disabled = index === 0;
        next.disabled = index === visible.length - 1;
        byId("fallback").href = item.video;
        byId("media-error").hidden = true;
        video.poster = item.poster;
        video.src = item.video;
        video.setAttribute("aria-label", item.title);
        if (!dialog.open) {
          dialog.showModal();
          document.body.style.overflow = "hidden";
          dismiss.focus();
        }
        video.play().catch(() => {});
      }

      search.addEventListener("input", render);
      previous.addEventListener("click", () => open(active - 1));
      next.addEventListener("click", () => open(active + 1));
      dismiss.addEventListener("click", () => dialog.close());
      video.addEventListener("error", () => {
        byId("media-error").hidden = !dialog.open;
      });
      dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;
        const box = dialog.getBoundingClientRect();
        if (event.clientX < box.left || event.clientX > box.right ||
            event.clientY < box.top || event.clientY > box.bottom) dialog.close();
      });
      dialog.addEventListener("keydown", event => {
        if (event.target === video || event.metaKey || event.ctrlKey || event.altKey) return;
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        open(active + (event.key === "ArrowLeft" ? -1 : 1));
      });
      dialog.addEventListener("close", () => {
        video.pause();
        video.removeAttribute("src");
        video.load();
        document.body.style.overflow = "";
        if (activationTarget?.isConnected) activationTarget.focus();
      });
      render();
    })();
  </script>
